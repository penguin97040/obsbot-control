name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux - tests and AppImage
    # The oldest supported Ubuntu, so the AppImage runs on older distributions too
    # (it needs the glibc it was built against or newer).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev \
            libx11-xcb-dev libxcb1-dev libfreetype-dev libfontconfig-dev libzstd-dev \
            libssl-dev pkg-config clang file desktop-file-utils

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}

      - name: Tests
        run: cargo test --locked

      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Release build
        run: cargo build --locked --release

      - name: AppImage
        run: packaging/linux/build-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: obsbot-control-linux
          path: dist/obsbot-control-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows - tests and exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy; rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ hashFiles('Cargo.lock') }}

      - name: Tests
        run: cargo test --locked

      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Release build
        run: cargo build --locked --release

      - name: Check it is a single exe
        shell: pwsh
        run: |
          # Only Windows system DLLs may be imported; anything else would have to ship beside the exe.
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          & $dumpbin.FullName /dependents target\release\obsbot-control.exe | Tee-Object -Variable deps
          $names = $deps | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '(?i)^[\w.-]+\.dll$' }
          # The C runtime must be linked in, not loaded (it isn't on every PC).
          $bad = $names | Where-Object {
            $_ -match '(?i)^(vcruntime|msvcp)' -or
            ($_ -notmatch '(?i)^(api|ext)-ms-win-' -and -not (Test-Path "$env:SystemRoot\System32\$_"))
          }
          if ($bad) { Write-Error "Unexpected DLL imports: $bad"; exit 1 }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: obsbot-control-windows
          path: target/release/obsbot-control.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to publish releases on v* tags
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/obsbot-control-windows/obsbot-control.exe \
            artifacts/obsbot-control-linux/obsbot-control-x86_64.AppImage \
            --repo "$GITHUB_REPOSITORY" --title "obsbot-control $GITHUB_REF_NAME" --generate-notes
